<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1C1B17">
<script>(function(){try{var t=localStorage.getItem("kairos-theme-v1");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="light"?"#F3EDE1":"#1C1B17";}catch(e){}})();</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Kairos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="favicon-16.png" sizes="16x16">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root, [data-theme="dark"] {
    --bg: #0C1214;
    --bg-2: #121A1D;
    --line: #222E32;
    --text: #E6E9E6;
    --mute: #6E7C80;
    --on-accent: #0C1214;
    --glow-alpha: .16;
    --fill-opacity: .9;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #F2F5F4;
    --bg-2: #E5EBE9;
    --line: #C9D2CF;
    --text: #121A1C;
    --mute: #5A6A6E;
    --on-accent: #0C1214;
    --glow-alpha: .2;
    --fill-opacity: .55;
    color-scheme: light;
  }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); overscroll-behavior: none; transition: background .35s ease, color .35s ease; }
  body { font-family: 'Archivo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #root {
    min-height: 100%;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font-family: inherit; }
  input { font-family: inherit; }
  ::selection { background: #4E8C74; color: var(--on-accent); }
  @keyframes breathe { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  @keyframes grow { from { transform: scaleY(0) } to { transform: scaleY(1) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>
</head>
<body>
<div id="root"></div>
<script src="react.js"></script>
<script src="react-dom.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
